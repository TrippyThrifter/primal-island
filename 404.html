<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost on the Island — Primal Island</title>
  <meta name="description" content="This page doesn't exist on Primal Island.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .lost {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    .lost__code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      color: var(--rust-bright);
      line-height: 1;
      margin: 0 0 0.5rem;
      letter-spacing: -0.03em;
    }
    .lost__title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 0 0 1rem;
    }
    .lost__text {
      color: var(--bone-dim);
      max-width: 420px;
      margin: 0 0 2.5rem;
      font-size: 1.05rem;
    }
    .lost__actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <div class="lost">
    <p class="lost__code">404</p>
    <h1 class="lost__title">You’ve wandered off the map.</h1>
    <p class="lost__text">
      This path doesn’t exist on Primal Island. The ecosystem is unforgiving — head back before something finds you.
    </p>
    <div class="lost__actions">
      <a href="/" class="btn btn--primary">Return to the Island</a>
      <a href="/#discord" class="btn btn--ghost">Discord</a>
    </div>
  </div>
</body>
</html>
